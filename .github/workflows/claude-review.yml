name: Claude review

# Automatic review of Linda's PRs: when one is opened, reopened, marked ready or gets new commits.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  review:
    if: github.event.pull_request.user.login == 'LindaCristalParra' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The project is a NestJS 12 + Prisma 7 (MySQL) backend for a hair
            salon booking app. Focus on:
            - Bugs and wrong behavior (validation, permissions by role, edge cases, transactions).
            - Prisma migrations: the SQL must match the schema and not lose data.
            - Consistency with the existing code (naming, error messages in Spanish, Swagger comments).
            - Security problems (data exposed to the wrong role, missing guards).

            Only comment on real problems; skip style nits that prettier or oxlint already cover.
            Use `mcp__github_inline_comment__create_inline_comment` for issues on specific lines and
            `gh pr comment` for one short summary at the end. Write in English.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
